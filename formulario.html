<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de pacientes con jQuery</title>

    <!-- Librería jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Estilos -->
    <style>

        /* para que esten medio redondeados */
        input {
            padding: 8px 12px;
            border: 2px solid #d9c7ff;
            border-radius: 12px;
            background: #faf6ff;
            outline: none;
        }

        /* para cuando se hace clic */
        input:focus {
            border-color: #ffb3cc;
            background: #fff;
        }

        /* tablita con los pacientes  */
        table {
            width: 100%;
            max-width: 650px;
            border-collapse: separate;   /* para que este redondito */
            border-spacing: 0;
            border: 3px solid #ffc2d6;
            border-radius: 16px;
            overflow: hidden;            /* para que las esquinas se vean redonditas */
        }

        /* encabezado de la pagina */
        th {
            padding: 12px 16px;
            text-align: left;
            background: #d9c7ff;        
            color: #fff;
        }

        /* celdas para los datitos */
        td {
            padding: 12px 16px;
            background: #ffe3ec;         
            border-top: 2px solid #fff;
        }

        /* filas rositas - azulito */
        tbody tr:nth-child(even) td {
            background: #d9f0ff;
        }

        /* para cuando pase por una fila se vea como tipo resaltado */
        tbody tr:hover td {
            background: #d4f5e2;        
        }

    </style>

</head>

<body>

    <h1>Registro de paciente</h1>

    <!-- Formulario -->
    <form id="formPaciente">

        <label for="nombre">Nombre:</label>
        <br>

        <input type="text" id="nombre">

        <br><br>


        <label for="correo">Correo:</label>
        <br>

        <input type="email" id="correo">

        <br><br>


        <label for="edad">Edad:</label>
        <br>

        <input type="number" id="edad">

        <br><br>


        <button type="submit">
            Registrar
        </button>

    </form>


    <!-- Mensaje de validación -->
    <p id="mensaje"></p>


    <!-- Tabla de pacientes -->
    <h2>Pacientes registrados</h2>

    <table>

        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Edad</th>
            </tr>
        </thead>

        <tbody id="listaPacientes">

        </tbody>

    </table>


    <script>

        // Detectamos cuando el usuario envía el formulario
        $("#formPaciente").on("submit", function(event) {

            // Evitamos que el formulario recargue la página
            event.preventDefault();


            // Obtenemos los valores de los campos
            let nombre = $("#nombre").val();

            let correo = $("#correo").val();

            let edad = $("#edad").val();


            // Creamos un arreglo para guardar los errores
            let errores = [];


            // Validamos el nombre
            if (nombre === "") {

                errores.push("El nombre es obligatorio.");

            }


            // Validamos el correo
            if (correo === "") {

                errores.push("El correo es obligatorio.");

            }


            // Validamos la edad
            if (edad === "") {

                errores.push("La edad es obligatoria.");

            }


            // Verificamos que la edad sea mayor o igual a 18
            if (edad !== "" && edad < 18) {

                errores.push(
                    "El paciente debe tener al menos 18 años."
                );

            }


            // Comprobamos si existen errores
            if (errores.length > 0) {


                // Limpiamos los mensajes anteriores
                $("#mensaje").html("");


                // Recorremos el arreglo de errores
                for (let i = 0; i < errores.length; i++) {

                    // Agregamos cada error al elemento mensaje
                    $("#mensaje").append(
                        "<p>" + errores[i] + "</p>"
                    );

                }

            }


            // Si no existen errores
            else {


                // Mostramos mensaje de registro exitoso
                $("#mensaje").html(
                    "<strong>Paciente registrado correctamente.</strong>"
                );


                // Agregamos el paciente a la tabla (una fila con una celda por campo)
                $("#listaPacientes").append(

                    "<tr>" +

                    "<td>" + nombre + "</td>" +

                    "<td>" + correo + "</td>" +

                    "<td>" + edad + "</td>" +

                    "</tr>"

                );


                // Limpiamos el formulario
                $("#formPaciente")[0].reset();

            }

        });

    </script>

</body>

</html>
